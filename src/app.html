<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#0b0613" />
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap"
			rel="stylesheet"
		/>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
		<!-- Umami (self-hosted at stats.cedricdessalles.dev, cookieless, first-party;
		     tracker renamed to insights.js to stay off adblock lists). Paste this
		     site's Website ID from the Umami dashboard — see umami/README.md. Until
		     then the tag is inert. SPA navigations are auto-tracked. -->
		<script
			defer
			src="https://stats.cedricdessalles.dev/insights.js"
			data-website-id="REPLACE_WITH_UMAMI_WEBSITE_ID"
		></script>
	</body>
</html>

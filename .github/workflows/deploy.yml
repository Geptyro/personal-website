name: Deploy

# Deploys the private Fly app `personal-website` on a version tag (vX.Y.Z).
# Pushing to main does NOT deploy — cut a tag to release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# ONE-TIME BOOTSTRAP (before the first tag — flyctl deploy does NOT create apps):
#   fly launch --flycast --no-deploy --name personal-website --org personal
#   # --flycast gives a PRIVATE 6PN address and no public IP. The gateway
#   # (cdd-gateway) routes cedricdessalles.dev here over .flycast.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: deploy-personal-website
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP: personal-website
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --app "$APP" --config fly.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # SECURITY GATE: this backend trusts x-forwarded-* headers, which is only
      # safe while it is private. A deploy can auto-allocate a public IP; fail the
      # job (and release them) if any non-private address is present, so the app
      # is never silently exposed to the internet.
      - name: Assert no public IP (private backend)
        run: |
          public=$(flyctl ips list --app "$APP" --json | jq -r '.[] | select(.Type != "private_v6") | .Address')
          if [ -n "$public" ]; then
            echo "::error::Public IP(s) found on private backend $APP: $public — releasing."
            for ip in $public; do flyctl ips release "$ip" --app "$APP" || true; done
            exit 1
          fi
          echo "OK: $APP has only a private Flycast address."
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

name: Deploy

# Deploys the private Fly app `personal-website` on a version tag (vX.Y.Z).
# Pushing to main does NOT deploy — cut a tag to release:
#   git tag v1.0.0 && git push origin v1.0.0
#
# Deploy logic (remote build + no-public-IP security gate) lives in the shared
# template Geptyro/github-workflows — this file only picks the app name.
#
# ONE-TIME BOOTSTRAP (before the first tag — flyctl deploy does NOT create apps):
#   fly launch --flycast --no-deploy --name personal-website --org personal
#   # --flycast gives a PRIVATE 6PN address and no public IP. The gateway
#   # (cdd-gateway) routes cedricdessalles.dev here over .flycast.
on:
  push:
    tags: ['v*']
  workflow_dispatch: {}

concurrency:
  group: deploy-personal-website
  cancel-in-progress: false

jobs:
  deploy:
    uses: Geptyro/github-workflows/.github/workflows/fly-deploy.yml@main
    with:
      app: personal-website
    secrets:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
